<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP-HTML/CSS | Contact</title>
    <link rel="Stylesheet" href="/style.css">
</head>
<body>
    <header>
        
        <div class="logo">
            <img src="../images/logo_labo.jpeg" alt="logo" class="logo-img">
            <span> Du code, de la réussite</span>
        </div>
        <nav class="menu">
            <ul>
                <li><a href="">Accueil</a></li>
                <li><a href="#">Cours</a></li>
                <li><a href="#">Exercices</a></li>
                <li><a href="#">Ressources</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

        <section class="entete-page">
            <h1>Contactez-nous</h1>
            <p>Une question? Un projet? Ecrivez-nous, nous répondons sous 24h
        </section>
    
    <main>
        <div class="form-contact">
            <form class="formulaire" action="#" method="post">
                <div class="champ">
                    <label for="nom">Nom complet</label>
                    <input type="text" name="nom" id="nom">
                </div>
                
                <div class="champ">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" name="email" id="email">
                </div>

                <div class="champ">
                    <label for="telephone">Telephone</label>
                    <input type="tel" name="telephone" id="telephone">
                </div>

                <div class="champ">
                    <label for="message">Message</label>
                    <textarea name="message" id="message"></textarea>
                </div>

                <button type="submit" class="btn">Envoyer le message</button>
            </form>
        </div>
    </main>


    <footer>
        <div class="f-text">&copy; 2026 - LABO ACADEMIQUE - Tous droits réservés</div>
        <div class="f-text">Contact : contact@laboacademy.fr | Suivez-nous sur <a href="http://">LinkedIn</a> et <a href="http://">Github</a>
    </footer>
</body>
</html>
